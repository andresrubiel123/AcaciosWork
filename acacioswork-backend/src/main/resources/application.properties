# Configuración de base de datos y servidor. @author RADJ
spring.application.name=acacioswork-backend

# Base de datos
# Base de datos (MySQL Local)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tienda_acacios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=INFO
# Inicialización con scripts SQL
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:tienda_acacios.sql
spring.sql.init.data-locations=classpath:04_initial_data.sql
spring.sql.init.continue-on-error=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Servidor
server.port=8081

# Configuración del motor de plantillas y recursos del Frontend externo. @author RADJ
spring.thymeleaf.prefix=file:../acacioswork-frontend/src/main/resources/templates/
spring.web.resources.static-locations=file:../acacioswork-frontend/src/main/resources/static/
spring.thymeleaf.cache=false

# Seguridad JWT
