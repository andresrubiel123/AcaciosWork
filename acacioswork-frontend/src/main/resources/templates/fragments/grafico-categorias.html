<!-- componente gráfico de barras horizontales: ventas por categoría de producto. @author RADJ -->
<div th:fragment="grafico-categorias" class="chart-section" style="margin-top: 2.5rem; display: block;">
    <div class="chart-container-wrapper" style="background: var(--bg-card); padding: 1.75rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);">

        <!-- encabezado del gráfico. @author RADJ -->
        <h3 style="margin-top: 0; color: var(--text-main); font-family: 'Outfit', sans-serif; font-size: 1.3rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-weight: 700; flex-wrap: wrap;">
            <span style="display: flex; align-items: center; gap: 0.5rem;">📊 Ventas por Categoría de Producto</span>
            
            <div class="period-selectors-container" style="display: flex; align-items: center; gap: 0.75rem; font-family: 'Inter', sans-serif;">
                <!-- Filtro de Mes -->
                <div style="display: flex; align-items: center; gap: 0.35rem;">
                    <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Mes:</span>
                    <select id="catFilterMes" style="cursor: pointer; padding: 0.35rem 1.5rem 0.35rem 0.75rem; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: 1px solid rgba(99, 102, 241, 0.4); background: rgba(30, 41, 59, 0.8); color: #818cf8; outline: none; transition: all 0.2s ease;">
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>

                <!-- Filtro de Año -->
                <div style="display: flex; align-items: center; gap: 0.35rem;">
                    <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Año:</span>
                    <div id="cat-year-select-wrapper" style="position: relative; display: inline-block;">
                        <!-- Selector normal -->
                        <select id="catFilterAno" onchange="onCatYearChange(this.value)" ondblclick="enableManualCatYearInput()" title="Doble clic para escribir año manualmente" style="cursor: pointer; padding: 0.35rem 1.5rem 0.35rem 0.75rem; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: 1px solid rgba(99, 102, 241, 0.4); background: rgba(30, 41, 59, 0.8); color: #818cf8; outline: none; transition: all 0.2s ease;">
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                        </select>
                        <!-- Input de escritura manual -->
                        <input id="catFilterAno-input" type="number" min="2000" max="2100" onblur="disableManualCatYearInput(this.value)" onkeydown="if(event.key==='Enter') disableManualCatYearInput(this.value)" style="display: none; width: 80px; padding: 0.35rem 0.5rem; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: 1px solid #f97316; background: rgba(30, 41, 59, 0.8); color: #f97316; outline: none; box-sizing: border-box;" placeholder="AAAA">
                    </div>
                </div>
            </div>
        </h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; font-family: 'Inter', sans-serif;">
            Compara el rendimiento de los diferentes tipos de productos que vendes. Identifica cuáles son tus categorías estrella y cuáles necesitan atención.
        </p>

        <!-- estilos oscuros para los controles de filtro. @author RADJ -->
        <style>
            #catFilterMes option {
                background-color: #1e293b;
                color: #f8fafc;
            }
            #catFilterMes:focus, #catFilterAno:focus {
                border-color: #6366f1;
                box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
            }
            #catFilterAno {
                cursor: pointer;
            }
        </style>

        <!-- resumen del período seleccionado. @author RADJ -->
        <div id="catPeriodoResumen"
            style="margin-bottom: 1.5rem; padding: 0.85rem 1.1rem; background: rgba(99,102,241,0.08); border-left: 3px solid #6366f1; border-radius: 0 8px 8px 0;">
            <p style="margin: 0 0 0.25rem 0; font-family: 'Outfit', sans-serif; font-size: 0.7rem; font-weight: 700; color: #a5b4fc; text-transform: uppercase; letter-spacing: 0.08em;">
                Resumen del Período Seleccionado
            </p>
            <p id="catResumenTexto"
                style="margin: 0; font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--text-main);">
                Cargando...
            </p>
        </div>

        <!-- contenedor del canvas con altura dinámica. @author RADJ -->
        <div id="categoryChartWrapper" style="position: relative; width: 100%;">
            <canvas id="categoryChart"></canvas>
        </div>

    </div>
</div>
