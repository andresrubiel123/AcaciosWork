<!-- componente gráfico de tendencia de ganancias mensuales. @author RADJ -->
<div th:fragment="grafico-ventas" class="chart-section" style="margin-top: 2.5rem; display: block;">
    <div class="chart-container-wrapper" style="background: var(--bg-card); padding: 1.75rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);">
        <h3 style="margin-top: 0; color: var(--text-main); font-family: 'Outfit', sans-serif; font-size: 1.3rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-weight: 700;">
            <span style="display: flex; align-items: center; gap: 0.5rem;">📈 Tendencia de Ganancias Mensuales</span>
            
            <div class="year-selector-container" style="display: flex; align-items: center; gap: 0.5rem; font-family: 'Inter', sans-serif;">
                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Año:</span>
                <div id="year-select-wrapper" style="position: relative; display: inline-block;">
                    <!-- Selector normal -->
                    <select id="sales-year-select" onchange="onSalesYearChange(this.value)" ondblclick="enableManualYearInput()" title="Doble clic para escribir año manualmente" style="cursor: pointer; padding: 0.35rem 1.5rem 0.35rem 0.75rem; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: 1px solid rgba(99, 102, 241, 0.4); background: rgba(30, 41, 59, 0.8); color: #818cf8; outline: none; transition: all 0.2s ease;">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                    </select>
                    <!-- Input de escritura manual -->
                    <input id="sales-year-input" type="number" min="2000" max="2100" onblur="disableManualYearInput(this.value)" onkeydown="if(event.key==='Enter') disableManualYearInput(this.value)" style="display: none; width: 80px; padding: 0.35rem 0.5rem; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: 1px solid #f97316; background: rgba(30, 41, 59, 0.8); color: #f97316; outline: none; box-sizing: border-box;" placeholder="AAAA">
                </div>
            </div>
        </h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; font-family: 'Inter', sans-serif;">
            Mide el rendimiento del negocio a lo largo del tiempo y detecta la estacionalidad de ganancias mensuales.
        </p>
        <div style="position: relative; height: 350px; width: 100%;">
            <canvas id="salesChart"></canvas>
        </div>
    </div>
</div>
