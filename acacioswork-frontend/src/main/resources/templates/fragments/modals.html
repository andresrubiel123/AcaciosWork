<!-- modales del sistema para creación, edición y visualización. @author RADJ -->
<div th:fragment="modals">
    <!-- ═══ modal genérico ═══. @author RADJ -->
    <div id="mainModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Nuevo Registro</h2>
            <form id="modal-form">
                <div id="modal-fields"></div>
                <div style="display:flex;gap:0.75rem;margin-top:0.5rem">
                    <button type="button" class="btn" style="flex:1;background:#334155;color:white"
                        onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-orange" style="flex:1">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ═══ modal detalles proveedor ═══. @author RADJ -->
    <div id="proveedorModal" class="modal-overlay">
        <div class="modal-content"
            style="max-width: 500px; background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1rem; padding: 2rem;">
            <h2 style="margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; color: white;">🏢
                Detalles del Proveedor</h2>
            <div id="prov-details-content"
                style="display: grid; gap: 0.85rem; font-size: 0.95rem; margin-bottom: 1.5rem; color: var(--text-muted);">
                <!-- se poblará dinámicamente. @author RADJ -->
            </div>
            <button type="button" class="btn btn-primary"
                style="width: 100%; padding: 0.6rem 1.2rem; border-radius: 0.5rem; border: none; font-weight: 600; cursor: pointer;"
                onclick="closeProveedorModal()">Cerrar</button>
        </div>
    </div>

    <!-- ═══ modal movimiento inventario ═══. @author RADJ / Antigravity -->
    <div id="movimientoModal" class="modal-overlay">
        <div class="modal-content"
             style="max-width: 480px; background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1rem; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
            <h2 id="mov-modal-title" style="margin-bottom: 0.25rem; color: white;">📈 Registrar Movimiento</h2>
            <p id="mov-modal-subtitle" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem;"></p>
            <form id="mov-modal-form">
                <input type="hidden" id="mov-id-producto">
                <input type="hidden" id="mov-tipo">
                
                <!-- Cantidad -->
                <div style="margin-bottom: 1.1rem;">
                    <label style="display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--text-muted);">Cantidad (Unidades) *</label>
                    <input type="number" id="mov-cantidad" min="1" placeholder="Ej: 10" required
                           style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-dark); color: var(--text-main); outline: none;">
                </div>

                <!-- Sección Fecha de Vencimiento con SmartCalendar (Solo visible en ENTRADA) -->
                <div id="mov-vencimiento-container" style="margin-bottom: 1.1rem;">
                    <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--text-muted);">
                        <span>Fecha de Vencimiento *</span>
                        <span id="mov-venc-warning" style="font-size: 0.75rem; color: #f87171; display: none;">⚠️ Menos de 30 días</span>
                    </label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input id="mov-fecha-vencimiento" type="text" placeholder="AAAA-MM-DD (Obligatorio)"
                               style="width: 100%; cursor: text; padding: 0.75rem; padding-right: 2.5rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-dark); color: var(--text-main); outline: none;">
                        <span id="smart-calendar-icon-mov-fecha-vencimiento" onclick="SmartCalendar.toggle('mov-fecha-vencimiento')"
                              style="position: absolute; right: 0.75rem; cursor: pointer; font-size: 1.1rem; user-select: none;">📅</span>
                    </div>
                </div>

                <!-- Sección Código de Lote con Botón Generar (Solo visible en ENTRADA) -->
                <div id="mov-lote-container" style="margin-bottom: 1.1rem;">
                    <label style="display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--text-muted);">Código / N° de Lote (Opcional)</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="mov-codigo-lote" placeholder="Ej: LOT-2026-A1 (Vacío = Auto)"
                               style="flex: 1; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-dark); color: var(--text-main); outline: none;">
                        <button type="button" onclick="window.autoGenerarLote()" style="background: #334155; color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); padding: 0.75rem 0.8rem; border-radius: 0.5rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap;">🎲 Generar</button>
                    </div>
                </div>

                <!-- Referencia -->
                <div style="margin-bottom: 1.1rem;">
                    <label style="display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--text-muted);">Referencia / N° Factura (Opcional)</label>
                    <input type="text" id="mov-referencia" placeholder="Ej: Factura #1024 - Proveedor XYZ"
                           style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-dark); color: var(--text-main); outline: none;">
                </div>
                
                <!-- Observación -->
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: var(--text-muted);">Observación (Opcional)</label>
                    <input type="text" id="mov-observacion" placeholder="Detalles adicionales del movimiento"
                           style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-dark); color: var(--text-main); outline: none;">
                </div>

                <!-- Tarjeta de Resumen / Vista Previa Proyectada de Stock -->
                <div id="mov-preview-card" style="margin-bottom: 1.25rem; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 0.5rem; font-size: 0.85rem; color: #cbd5e1; display: flex; justify-content: space-between; align-items: center;">
                    <span>Stock Actual: <strong id="mov-preview-actual" style="color: white;">0 u.</strong></span>
                    <span>➔ Nuevo Stock: <strong id="mov-preview-nuevo" style="color: #38bdf8;">0 u.</strong></span>
                </div>
                
                <div style="display: flex; gap: 0.75rem;">
                    <button type="button" class="btn" style="flex: 1; background: #334155; color: white; padding: 0.75rem; border-radius: 0.5rem; border: none; font-weight: 600; cursor: pointer;"
                            onclick="closeMovimientoModal()">Cancelar</button>
                    <button type="submit" id="mov-submit-btn" class="btn" style="flex: 1; padding: 0.75rem; border-radius: 0.5rem; border: none; font-weight: 600; cursor: pointer; color: white;">Confirmar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- toast de notificación. @author RADJ -->
    <div id="toast" class="toast"></div>
</div>
