<!-- tabla y buscador de productos del inventario. @author RADJ -->
<div th:fragment="products-table">
    <!-- buscador de inventario. @author RADJ -->
    <div class="search-container" style="position: relative; margin-bottom: 1rem;">
        <input type="text" id="inv-search-input" oninput="filterTable(this, 'inv-tbody')"
            placeholder="🔍 Buscar en la tabla..."
            style="width: 100%; padding: 0.75rem 1rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-card); color: var(--text-main); font-size: 0.9rem; outline: none; margin-bottom: 0;">
    </div>
    <div class="card">
        <table class="products-table">
            <thead>
                <tr>
                    <th class="col-codigo sortable" data-sort="codigoBarras">Código</th>
                    <th class="col-nombre sortable" data-sort="nombre">Nombre</th>
                    <th class="col-unidad">Unidad</th>
                    <th class="col-stock sortable" data-sort="stockActual">Stock</th>
                    <th class="col-precio sortable" data-sort="precioCompra">P. Compra</th>
                    <th class="col-precio sortable" data-sort="precioVenta">P. Venta</th>
                    <th class="col-vencimiento sortable" data-sort="fechaVencimiento">Vencimiento</th>
                    <th class="col-iva sortable" data-sort="iva">IVA</th>
                    <th class="col-estado sortable" data-sort="estado">Estado</th>
                    <th class="col-movimientos">Movimientos</th>
                    <th class="col-acciones">Acciones</th>
                </tr>
            </thead>
            <tbody id="inv-tbody">
                <tr>
                    <td colspan="11" style="text-align:center;padding:2rem;color:var(--text-muted)">
                        Cargando...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
